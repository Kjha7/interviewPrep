spring.application.name=stock-trading-platform
server.port=8080

# ---------------------------------------------------------------------------
# PostgreSQL - UserAccount, UserCredentials, Wallet, Order (partitioned by user_id),
# OutboxEvent. See docker/schema-partitioning.sql for the Order table DDL.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/trading_platform
spring.datasource.username=trading_app
spring.datasource.password=changeme
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Postgres logical replication is required for Debezium CDC on the outbox table.
# wal_level=logical must also be set on the Postgres server itself (not via this file).

# ---------------------------------------------------------------------------
# Cassandra - Portfolio (read-optimized projection, partitioned by user_id)
# ---------------------------------------------------------------------------
spring.cassandra.keyspace-name=trading_platform
spring.cassandra.contact-points=localhost
spring.cassandra.port=9042
spring.cassandra.local-datacenter=datacenter1
spring.cassandra.schema-action=none

# ---------------------------------------------------------------------------
# Redis - refresh tokens (app.security.refresh-token-ttl-seconds) and
# idempotency keys (app.idempotency.ttl-hours)
# ---------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# ---------------------------------------------------------------------------
# Kafka - outbox events land here via Debezium CDC, not via direct app publish.
# See docker/debezium-connector-config.json for the connector that does the publishing.
# ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# ---------------------------------------------------------------------------
# App-specific config
# ---------------------------------------------------------------------------
# JWT signing secret for the short-lived session token. MUST be overridden per-environment
# via an env var / secrets manager - never commit a real secret here.
app.security.jwt-secret=${JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
app.security.session-token-ttl-seconds=900
app.security.refresh-token-ttl-seconds=28800

# Base64 AES-256 key for KycEncryptedConverter. MUST come from a KMS in production -
# see the warning comment on KycEncryptedConverter itself.
app.security.kyc-encryption-key=${KYC_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

app.idempotency.ttl-hours=24

# Stock exchange market-data WebSocket feed - owned by the single MarketDataService bean,
# not opened per user login.
app.exchange.websocket-url=${EXCHANGE_WS_URL:wss://exchange.example.com/marketdata}

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging.level.com.tekion.interview.stockTradingPlatform=INFO
logging.level.org.springframework.kafka=WARN
